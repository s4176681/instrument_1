<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <!--For the sounds-->
    <script src="main.js" defer></script>
    <!--For the playbutton-->
    
    
</head>
<body>
    <dialog id="intro-modal">
        <p>I'm going to make some noise!</p>
        <p>Warning flashing lights</p>
        <button id="intro-modal-close">ok</button>
    </dialog>

    <div class="header-bar">
        <h1>The Dynamic Sound track-er</h1>
    </div>
    

    <header class="top-bar">
        
        <div class="control-group">
            <label for="preset-select">Presets</label>
            <select id="preset-select">
                <option value="none">No Preset</option>
                <option value="1">Preset 1</option> <!--option value links to JS-->
                <option value="2">Preset 2</option>
                <option value="3">Preset 3</option>
                <option value="4">Preset 4</option>
            </select>
        </div>

        <div class="playPauseButton">
            <label for="playPauseButton">Play/Record</label>
            <button id="playPauseButton">
                <img 
                src="https://img.icons8.com/ios-glyphs/30/play--v1.png" 
                alt="Play Button"
                width="24"
                height="27"
                />
            </button>
        </div>

        <div class="control-group">
            <label for="speed-slider">Loop Duration</label>
            <input type="range" id="speed-slider" min="2000" max="10000" step="500" value="6000">
        </div>

        <div class="control-group">
            <label for="octave-select">Octaves</label>
            <select id="octave-select">
                <option value="0">Normal</option>
                <option value="-1">Low</option>  
                <option value="1">High</option>
            </select>
        </div>

        <div class="control-group">
            <label for="volume-slider">Master Volume</label>
            <input type="range" id="volume-slider" min="0" max="100" value="50">
        </div>

        <div class="control-group">
            <label for="play-mode">Playmode</label>
            <select id="play-mode">
                <option value="single">Single note</option>
                <option value="chord">White Key Chords</option>
            </select>
        </div>

    </header>

    <main> <!--creating a simple 7 note selection-->
        <!--KEYS-->
        <div class="instrument-area">
            <div class="canvas-wrap">
                <div id="clearRows"></div>
                <canvas id="visualiser" width="1500" height="400"></canvas>
                
                <div class="keysRow"> <!--Change the notes for a different key/sound-->
                    <button class="whiteKey" data-note="C4">C</button>
                    <button class="blackKey" data-note="C#4">C#</button>
                    <button class="whiteKey" data-note="D4">D</button>
                    <button class="blackKey" data-note="D#4">D#</button>
                    <button class="whiteKey" data-note="E4">E</button>
                    <button class="whiteKey" data-note="F4">F</button>
                    <button class="blackKey" data-note="F#4">F#</button>
                    <button class="whiteKey" data-note="G4">G</button>
                    <button class="blackKey" data-note="G#4">G#</button>
                    <button class="whiteKey" data-note="A4">A</button>
                    <button class="blackKey" data-note="A#4">A#</button>
                    <button class="whiteKey" data-note="B4">B</button>
                    <button class="whiteKey" data-note="C5">C</button>
                </div>
            </div>
        </div>

        </div>


    </main>

        <!--More controls to be added-->


</body>
</html>
