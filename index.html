<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <!--For the sounds-->
    <script src="main.js" defer></script>
    <!--For the playbutton-->

    
    <script src="playpause.js" defer></script>
    
    
</head>
<body>
    <dialog id="intro-modal">
        <p>I'm going to make some noise!</p>
        <button id="intro-modal-close">ok</button>
    </dialog>

    <header>
        <h1>Audio Instrument</h1>
    </header>

    <main> <!--creating a simple 7 note selection-->
        <!--KEYS-->
        <div class="keysRow"> <!--Change the notes for a different key/sound-->
            <button class="whiteKey" data-note="C4">C</button>
            <button class="whiteKey" data-note="D4">D</button>
            <button class="whiteKey" data-note="E4">E</button>
            <button class="whiteKey" data-note="F4">F</button>
            <button class="whiteKey" data-note="G4">G</button>
            <button class="whiteKey" data-note="A4">A</button>
            <button class="whiteKey" data-note="B4">B</button>

        </div>



        <div class="playPauseButton">
            <button>
                <img 
                src="https://img.icons8.com/ios-glyphs/30/play--v1.png" 
                alt="Play Button"
                width="24"
                height="27"
                />
            </button>
        </div>
        
        <div class="SLIDERS">
            <!--This is for a slider-->
            <div id="volume">
                <label for="volume">Volume</label>
                <input type="range" min="0" max="100" value="50">
                
            </div>

            <div>
                <label for="mixer">mixer</label>
                <input type="range" min="0" max="100" value="50">
            </div>

            <div>
                <label for="EQ">EQ</label>
                <input type="range" min="0" max="100" value="50">
            </div>

        </div>

            <!--More controls to be added-->





    </main>

</body>
</html>
